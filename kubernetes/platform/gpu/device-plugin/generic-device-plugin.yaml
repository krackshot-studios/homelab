apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-gpu-device-plugin
  namespace: gpu-system
  labels:
    app.kubernetes.io/name: amd-gpu-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-gpu-device-plugin

  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-gpu-device-plugin

    spec:
      automountServiceAccountToken: false

      nodeSelector:
        homelab.io/gpu: amd
        homelab.io/gpu-model: rx6750xt

      tolerations:
        - key: homelab.io/gpu
          operator: Equal
          value: amd
          effect: NoSchedule

      containers:
        - name: generic-device-plugin
          image: squat/generic-device-plugin:0.2.0
          imagePullPolicy: IfNotPresent

          args:
            - --domain=homelab.io
            - --device
            - |
              name: amd-gpu
              groups:
                - paths:
                    - path: /dev/dri/renderD128
                    - path: /dev/kfd

          securityContext:
            privileged: true

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins

            - name: dev
              mountPath: /dev

      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory

        - name: dev
          hostPath:
            path: /dev
            type: Directory

  updateStrategy:
    type: RollingUpdate
