apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: truenas-nfs

provisioner: csi.truenas.io

parameters:
  protocol: "nfs"
  pool: "tank"
  datasetPath: "kubernetes/nfs"
  compression: "LZ4"

  nfs.hosts: "192.168.40.111,192.168.40.112,192.168.40.113,192.168.40.121,192.168.40.122,192.168.40.123,192.168.40.124"

reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
